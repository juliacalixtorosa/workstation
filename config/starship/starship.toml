# ==========================================================
# Starship Prompt Configuration
# Workstation Prompt v1
# ==========================================================

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$docker_context\
$terraform\
$kubernetes\
$aws\
$status
[❯](bold green) """

# ==========================================================
# Core
# ==========================================================

[hostname]
disabled = false
ssh_only = false
format = "[$hostname](bold blue) "

[directory]
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"

[status]
disabled = false
success_symbol = ""
symbol = "✗ "
style = "bold red"

# ==========================================================
# Git
# ==========================================================

[git_branch]
symbol = " "

[git_status]
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
conflicted = "="
deleted = "✘"
modified = "!"
renamed = "»"
staged = "+${count}"
stashed = "*"
untracked = "?"
up_to_date = ""

# ==========================================================
# Languages
# ==========================================================

[c]
symbol = " "

[cmake]
symbol = "△ "

[python]
symbol = " "

[nodejs]
symbol = " "

# ==========================================================
# DevOps
# ==========================================================

[docker_context]
symbol = " "

[terraform]
symbol = " "

[kubernetes]
symbol = "☸ "

[aws]
symbol = " "