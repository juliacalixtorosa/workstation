# ==========================================================
# Starship Prompt Configuration
# Workstation Prompt v2
#
# Professional dark theme with Powerline blocks
# Designed for Software Engineering and DevOps workflow
# ==========================================================


# ==========================================================
# Prompt Layout
# ==========================================================

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$c\
$cmake\
$docker_context\
$kubernetes\
$terraform\
$aws\
$line_break\
$character"""


# ==========================================================
# Identity
# ==========================================================

[username]
show_always = true
format = "[ $user ]($style)"
style_user = "bold purple"
style_root = "bold red"


[hostname]
ssh_only = true
format = "[@$hostname](bold purple) "


# ==========================================================
# Directory
# ==========================================================

[directory]
format = "[ $path ]($style)"
style = "bold white"
truncation_length = 3
truncate_to_repo = true
read_only = " 🔒"


# ==========================================================
# Git
# ==========================================================

[git_branch]
format = "[  $branch ]($style)"
symbol = " "
style = "bold blue"


[git_status]
format = "[$all_status$ahead_behind ]($style)"

style = "bold yellow"

conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
stashed = "*${count}"


# ==========================================================
# Languages
# ==========================================================

[python]
format = "[  $version ]($style)"
symbol = " "
style = "bold green"


[nodejs]
format = "[  $version ]($style)"
symbol = " "
style = "bold green"


[c]
format = "[  $version ]($style)"
symbol = " "
style = "bold cyan"


[cmake]
format = "[ △ $version ]($style)"
symbol = "△ "
style = "bold cyan"


# ==========================================================
# DevOps
# ==========================================================

[docker_context]
format = "[  $context ]($style)"
symbol = " "
style = "bold blue"


[kubernetes]
format = "[ ☸ $context ]($style)"
symbol = "☸ "
style = "bold cyan"


[terraform]
format = "[  $workspace ]($style)"
symbol = " "
style = "bold purple"


[aws]
format = "[  $profile ]($style)"
symbol = " "
style = "bold yellow"


# ==========================================================
# Prompt Character
# ==========================================================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"


# ==========================================================
# Line Break
# ==========================================================

[line_break]
disabled = false