# ==========================================================
# Starship Prompt Configuration
# Workstation Prompt v3
#
# Theme:
#   Tokyo Night × Pastel Powerline
#
# ==========================================================

format = """
[](fg:#a3aed2)\
$username\
$hostname\
[](fg:#a3aed2 bg:#769ff0)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$python\
$nodejs\
$c\
$cmake\
[](fg:#212736 bg:#1d2230)\
$docker_context\
$kubernetes\
$terraform\
$aws\
[](fg:#1d2230)\
$line_break\
$character
"""

# ==========================================================
# Identity
# ==========================================================

[username]
show_always = true
style_user = "bg:#a3aed2 fg:#090c0c bold"
style_root = "bg:#a3aed2 fg:#ff5555 bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = true
style = "bg:#a3aed2 fg:#090c0c bold"
format = "[@$hostname ]($style)"

# ==========================================================
# Directory
# ==========================================================

[directory]
style = "bg:#769ff0 fg:#e3e5e5"
format = "[ $path ]($style)"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = "󰇚 "
"Pictures" = "󰉏 "
"Music" = "󱍙 "

# ==========================================================
# Git
# ==========================================================

[git_branch]
symbol = "󰊢"
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = "[$all_status$ahead_behind ](fg:#769ff0 bg:#394260)"

stashed = " ${count} "
ahead = "󰞙 ${count} "
behind = "󰞒 ${count} "
diverged = "󰵉 ${ahead_count} ${behind_count} "
conflicted = " ${count} "
deleted = " ${count} "
renamed = " ${count} "
modified = " ${count} "
staged = " ${count} "
untracked = "󱅘 ${count}"

# ==========================================================
# Languages
# ==========================================================

[python]
symbol = ""
style = "bg:#212736"
format = "[ $symbol ${pyenv_prefix}(${version}) ](fg:#769ff0 bg:#212736)"

[nodejs]
symbol = ""
style = "bg:#212736"
format = "[ $symbol (${version}) ](fg:#769ff0 bg:#212736)"

[c]
symbol = ""
style = "bg:#212736"
format = "[ $symbol (${version}) ](fg:#769ff0 bg:#212736)"

[cmake]
symbol = "△"
style = "bg:#212736"
format = "[ $symbol (${version}) ](fg:#769ff0 bg:#212736)"

# ==========================================================
# Infrastructure
# ==========================================================

[docker_context]
symbol = ""
style = "bg:#1d2230"
format = "[ $symbol $context ](fg:#a0a9cb bg:#1d2230)"

[kubernetes]
symbol = "☸"
style = "bg:#1d2230"
format = "[ $symbol $context ](fg:#a0a9cb bg:#1d2230)"

[terraform]
symbol = ""
style = "bg:#1d2230"
format = "[ $symbol $workspace ](fg:#a0a9cb bg:#1d2230)"

[aws]
symbol = ""
style = "bg:#1d2230"
format = "[ $symbol $profile ](fg:#a0a9cb bg:#1d2230)"

# ==========================================================
# Prompt
# ==========================================================

[character]
success_symbol = "[❯](bold #769ff0)"
error_symbol = "[❯](bold red)"

[line_break]
disabled = false